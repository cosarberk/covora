server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API isteklerini server servisine proxy'le (same-origin studio için)
  location ~ ^/(reviews|projects|rules|chat|health)(/|$) {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: bilinmeyen yolları index.html'e yönlendir
  location / {
    try_files $uri $uri/ /index.html;
  }
}
