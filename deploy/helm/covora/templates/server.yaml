apiVersion: apps/v1
kind: Deployment
metadata:
  name: covora
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: covora
  template:
    metadata:
      labels:
        app: covora
    spec:
      containers:
        - name: covora
          image: {{ .Values.image.registry }}/covora:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.db }}
            # AI sağlayıcıları ENV'den verilmez; Studio → "AI Sağlayıcılar"
            # sayfasından DB'ye kaydedilir (Ollama dahil hiçbir tür ayrıcalıklı değil).
            - name: COVORA_AUTH_SECRET
              value: {{ .Values.auth.secret | quote }}
            - name: COVORA_ADMIN_EMAIL
              value: {{ .Values.auth.adminEmail | quote }}
            - name: COVORA_ADMIN_PASSWORD
              value: {{ .Values.auth.adminPassword | quote }}
            - name: COVORA_CORS_ORIGINS
              value: {{ .Values.auth.corsOrigins | quote }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: covora
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: covora
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
