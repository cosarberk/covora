apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: {{ .Values.image.registry }}/server:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.db }}
            - name: OLLAMA_UI_BASE_URL
              value: 'http://ollama:11434'
            - name: OLLAMA_UI_MODEL
              value: {{ .Values.ollama.models.ui | quote }}
            - name: OLLAMA_CODE_BASE_URL
              value: 'http://ollama:11434'
            - name: OLLAMA_CODE_MODEL
              value: {{ .Values.ollama.models.code | quote }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: server
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
