apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: '0.0.0.0'
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.keepAlive | quote }}
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # Modelleri ARKA PLANDA indir (idempotent; PVC'de kalıcı).
          # Arka plan şart: model indirme uzun sürer; postStart'ı bloklarsa
          # pod "ready" olamaz ve deployment progress deadline'ı aşılır.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    (
                      until ollama list >/dev/null 2>&1; do sleep 3; done
                      ollama pull {{ .Values.ollama.models.ui }}
                      ollama pull {{ .Values.ollama.models.code }}
                    ) >/tmp/pull.log 2>&1 &
          # CPU'da model yüklemesi dakikalarca sürer; bu sırada `/` geç cevap
          # verir. Probe toleranslı olmazsa pod "NotReady" olur, Service'ten
          # düşer ve Covora Ollama'ya ulaşamaz (timeout). 30×60 = 1800sn ≈ 30 dk
          # yükleme toleransı.
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 60
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
