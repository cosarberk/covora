# Covora Helm değerleri. Cluster'a özel alanları (registry, storageClass)
# doldurun; gerisi makul varsayılanlarla gelir.

image:
  # Docker Hub kullanıcısı; imajlar <registry>/covora-server ve <registry>/covora-studio
  registry: docker.io/cosarberk
  tag: latest
  # Always: Rancher'da "Redeploy" her seferinde taze latest'i çeker (eventium ile aynı düzen)
  pullPolicy: Always

# Boş bırakılırsa cluster'ın varsayılan StorageClass'ı kullanılır
storageClass: ''

postgres:
  image: postgres:17-alpine
  user: covora
  password: covora
  db: covora
  storage: 5Gi
  resources:
    requests:
      cpu: '250m'
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi

ollama:
  image: ollama/ollama:latest
  storage: 20Gi
  keepAlive: 30m
  models:
    ui: qwen3-vl:8b
    code: qwen3-coder:7b
  resources:
    requests:
      cpu: '4'
      memory: 10Gi
    limits:
      cpu: '16'
      memory: 16Gi

# Tek servis: Fastify API + gömülü studio (React static) aynı porttan.
server:
  replicas: 1
  port: 4000
  resources:
    requests:
      cpu: '250m'
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi

# Dış erişim (UI + API aynı host, same-origin). enabled=true + host verildiğinde
# müşteri Covora'ya bu URL'den erişir.
ingress:
  enabled: false
  className: nginx
  host: covora.example.com
  annotations:
    # Ekran görüntüsü base64'ü büyük olabilir
    nginx.ingress.kubernetes.io/proxy-body-size: '25m'
    # CPU'da LLM review yavaştır; bağlantı erken kapanmasın
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
  tls:
    enabled: false
    secretName: covora-tls
