name: Publish image

# main'e her push/merge'de: sürümü OTOMATİK bump eder (git tag'i pipeline atar),
# tek Covora image'ını Docker Hub'a o sürümle yayınlar.
on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  OWNER: cosarberk

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # otomatik git tag push için
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mevcut tag'leri görebilmek için

      # Sürümü otomatik artır ve git tag'i at (patch varsayılan;
      # commit mesajında #minor / #major ile kontrol edilir).
      - name: Bump version & tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/covora
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.new_tag }}
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
