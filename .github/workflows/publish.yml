name: Publish image

# main'e her push/merge'de: sürümü OTOMATİK bump eder (git tag),
# Helm chart version'ını da bump edip push eder (Rancher "Edit → version"
# dropdown'unda görünür), ve image'ı Docker Hub'a yayınlar.
on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  OWNER: cosarberk

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tag + chart version push için
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sürümü otomatik artır ve git tag'i at (patch varsayılan;
      # commit mesajında #minor / #major ile kontrol).
      - name: Bump version & tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main

      # Helm chart version'ını yeni sürüme eşitle ve push et
      # ([skip ci] ile bu push tekrar publish tetiklemez → sonsuz döngü yok).
      - name: Bump Helm chart version
        run: |
          VER="${{ steps.tag.outputs.new_tag }}"
          VER="${VER#v}"
          sed -i "s/^version:.*/version: ${VER}/" deploy/helm/covora/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): helm chart ${VER} [skip ci]"
          git push origin HEAD:main

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/covora
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.new_tag }}
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
